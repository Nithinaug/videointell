<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#05060a"/>
  <g filter="url(#blur)" opacity="0.6">
    <circle cx="420" cy="260" r="420" fill="#7c3aed"/>
    <circle cx="1560" cy="340" r="380" fill="#0ea5e9"/>
    <circle cx="980" cy="980" r="340" fill="#10b981" fill-opacity="0.7"/>
  </g>
  <rect width="1920" height="1080" fill="url(#grain)"/>
</svg>
